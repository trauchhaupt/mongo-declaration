name: Build, Sign, and Publish Plugin

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify version matches Git tag
        run: |
          # Extract the 'version' value from gradle.properties and strip whitespace/carriage returns
          PROP_VERSION=$(grep -E '^version\s*=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          # Get the Git tag name (strip a leading 'v' if your tags look like 'v1.0.0')
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "gradle.properties version: '$PROP_VERSION'"
          echo "Git tag version:           '$TAG_VERSION'"

          if [ -z "$PROP_VERSION" ]; then
            echo "::error::Could not find a 'version' property in gradle.properties."
            exit 1
          fi

          if [ "$PROP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! gradle.properties ($PROP_VERSION) does not match tag ($TAG_VERSION)."
            exit 1
          fi

      # ... your existing Java/Gradle setup and publish steps go here ...
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests and Verify Plugin
        run: ./gradlew check verifyPlugin
        env:
          ORG_GRADLE_PROJECT_pluginVersion: ${{ github.ref_name }}

      - name: Build Plugin Artifact
        run: ./gradlew buildPlugin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

  publish:
    name: Sign and Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish Plugin
        run: ./gradlew publishPlugin
        env:
          ORG_GRADLE_PROJECT_pluginVersion: ${{ github.ref_name }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}