name: Build, Sign, and Publish Plugin

on:
  push:
    tags:
      - '[Vv]*' # Trigger on version tags like v1.0.0 or V1.0.0

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update gradle.properties version from V-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == V* ]]; then
            NEW_VERSION="${GITHUB_REF_NAME#V}"
            echo "Tag starts with 'V'. Updating gradle.properties version to '$NEW_VERSION'..."

            if grep -qE '^version\s*=' gradle.properties; then
              sed -i -E "s/^version\s*=.*/version=${NEW_VERSION}/" gradle.properties
            else
              echo "::error::Could not find a 'version' property in gradle.properties to update."
              exit 1
            fi
          else
            echo "Tag '$GITHUB_REF_NAME' does not start with 'V'. Leaving gradle.properties unchanged."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests and Verify Plugin
        run: ./gradlew check verifyPlugin

      - name: Build Plugin Artifact
        run: ./gradlew buildPlugin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

  publish:
    name: Sign and Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update gradle.properties version from V-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == V* ]]; then
            NEW_VERSION="${GITHUB_REF_NAME#V}"
            sed -i -E "s/^version\s*=.*/version=${NEW_VERSION}/" gradle.properties
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish Plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}