<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="paint0_linear" x1="2.94" y1="4.9" x2="37.78" y2="39.73" gradientUnits="userSpaceOnUse">
            <stop offset="0.159" stop-color="#3BEA62"/>
            <stop offset="0.540" stop-color="#3C99CC"/>
            <stop offset="0.937" stop-color="#6B57FF"/>
        </linearGradient>
        <clipPath id="eyeOpening">
            <path d="M 5 21.5 C 11 12.5 22 11 35 17.5 C 26 26.5 14 26.5 5 21.5 Z"/>
        </clipPath>
    </defs>

    <!-- Eye interior with clip -->
    <g clip-path="url(#eyeOpening)">
        <!-- Sclera backdrop -->
        <path d="M 5 21.5 C 11 12.5 22 11 35 17.5 C 26 26.5 14 26.5 5 21.5 Z" fill="url(#paint0_linear)" fill-opacity="0.15"/>
        <!-- Iris (partially covered by upper lid for half-opened look) -->
        <circle cx="20" cy="18.5" r="6" fill="url(#paint0_linear)"/>
        <!-- Pupil -->
        <circle cx="20" cy="18.5" r="3" fill="#1C1D21"/>
        <!-- Catchlights -->
        <circle cx="21.8" cy="16.8" r="1.3" fill="#FFFFFF"/>
        <circle cx="18" cy="20" r="0.7" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>

    <!-- Eyelid crease / epicanthic fold -->
    <path d="M 9 11.5 C 15 7.5 24 7.8 31 12" stroke="url(#paint0_linear)" stroke-width="1.6" stroke-linecap="round" fill="none" stroke-opacity="0.75"/>

    <!-- Upper eyelid / lash line (strong, almond shape) -->
    <path d="M 4 21.5 C 10.5 12.5 22 10.8 36 17.5" stroke="url(#paint0_linear)" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    <!-- Lower eyelid curve -->
    <path d="M 6 22 C 14.5 26.8 25.5 26.2 34 18.5" stroke="url(#paint0_linear)" stroke-width="1.8" stroke-linecap="round" fill="none" stroke-opacity="0.85"/>
</svg>
